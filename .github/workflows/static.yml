name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:
  # Disparado pelo workflow do NotificacoesTJ após publicar nova release
  repository_dispatch:
    types: [update-db]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download bases cifradas das releases
        # uma base por grupo (<hash da senha>.enc, ver NotificacoesTJ/catalogo.py)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download latest \
            --pattern '*.enc' \
            || echo "⚠️  Release 'latest' não encontrada — deploy sem base cifrada."

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
